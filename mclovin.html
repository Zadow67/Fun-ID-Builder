<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>superbad: mclovin's driver license</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mclovin.css">
</head>
<body>
    <header>
        <h1>superbad:</h1>
        <h2>mclovin's driver license</h2>
    </header>

    <main>
        <section class="Cards">

            <div class="front-card">
                <img src="mclovin-custom-front.png" alt="Loki TVA ID front">
                <label for="photo-upload" class="upload-button" id="drop-zone">
                    <img id="photo-preview" alt="Uploaded portrait">
                    <span id="upload-text">＋<br>Drop photo<br>or click to upload</span>
                </label>
                <input type="file" id="photo-upload" accept="image/png">
            </div>
        </section>
            <div class="actions">
                <button id="downloadButton" type="button"><span>↓</span> download custom id</button>
            </div>
        </section>

        </div>
    </main>
</body>
<script src="script.js"></script>
</html>
