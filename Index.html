<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doomsday: Loki TVA ID</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>DOOMSDAY:</h1>
        <h2>LOKI TVA ID</h2>
    </header>

    <main>
        <section class="Cards">

            <div class="front-card">
                <img src="tva-loki-custom-front.png" alt="Loki TVA ID front">
                <label for="photo-upload" class="upload-button" id="drop-zone">
                    <img id="photo-preview" alt="Uploaded portrait">
                    <span id="upload-text">＋<br>Drop photo<br>or click to upload</span>
                </label>
                <input type="file" id="photo-upload" accept="image/png">
            </div>
            <div class="back-card">
                <img src="tva-loki-back.png" alt="Loki TVA ID back">
            </div>
        </section>
            <div class="actions">
                <button id="downloadButton" type="button">
                    <span>↓</span> download custom id
                </button>
            </div>
        </section>
        <footer class="id-gallery">
            <div class="gallery-heading">
                <h2>MORE ID DESIGNS</h2>
                <p>More IDs are being added. Stay tuned!</p>
            </div>

            <div class="others">
                <article class="others-card">
                    <a href="mclovin.html">
                    <div class="card-image">
                        <img src="mclovin-default-front.png" alt="McLovin ID design" loading="lazy">
                    </div>
                    </a>
                    <div class="card-details">
                        <h3>McLovin ID</h3>
                        <p>Classic ID design</p>
                    </div>
                </article>
            </div>
        </footer>
        </div>
    </main>
</body>
<script src="script.js"></script>
</html>
